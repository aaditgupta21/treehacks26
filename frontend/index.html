<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rally</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="fluid-canvas"></canvas>
  <div class="app">
    <header class="header" id="header-bar">
      <div class="header-left">
        <span class="header-date" id="header-date"></span>
      </div>
      <a href="#home" class="logo">RALLY</a>
      <nav class="nav">
        <a href="#dashboard" class="nav-link" data-page="dashboard">Dashboard</a>
      </nav>
    </header>

    <main class="main">
      <div class="view-container">
        <div class="page-view active" id="page-home">
          <section class="hero-home">
            <h1 class="hero-headline">Shared<br />Intelligence</h1>
            <p class="hero-tagline">AI that works as one with your team</p>
            <a href="#dashboard" class="btn btn-dashboard" data-page="dashboard">Dashboard</a>
          </section>
        </div>

        <div class="page-view" id="page-dashboard">
          <div class="dash-tabs">
            <button class="dash-tab active" data-tab="calendar">Calendar</button>
            <button class="dash-tab" data-tab="entries">Entries</button>
            <button class="dash-tab" data-tab="add">Add Entry</button>
          </div>

          <div class="dash-panel active" id="panel-calendar">
            <div class="calendar-grid" id="dashboard-calendar"></div>
          </div>

          <div class="dash-panel" id="panel-entries">
            <div class="entries-list" id="dashboard-entries"></div>
          </div>

          <div class="dash-panel" id="panel-add">
            <form class="add-form" id="add-form">
              <div class="form-group">
                <label class="form-label" for="key">Key</label>
                <input type="text" class="form-input" id="key" name="key" placeholder="e.g. brand_colors" required />
              </div>
              <div class="form-group">
                <label class="form-label" for="value">Value</label>
                <input type="text" class="form-input" id="value" name="value" placeholder="e.g. #FF6B35 and #004E89" required />
              </div>
              <div class="form-group">
                <label class="form-label" for="category">Category</label>
                <select class="form-select" id="category" name="category">
                  <option value="brand">Brand</option>
                  <option value="policy">Policy</option>
                  <option value="preference">Preference</option>
                  <option value="fact">Fact</option>
                </select>
              </div>
              <button type="submit" class="btn btn-primary">Add entry</button>
            </form>
            <div class="toast" id="toast">Entry added.</div>
          </div>
        </div>
      </div>
    </main>

  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>init();</script>
</body>
</html>
